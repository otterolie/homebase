# Modern tmux config
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Better prefix (Ctrl+a instead of Ctrl+b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Start windows/panes at 1 instead of 0
set -g base-index 1
setw -g pane-base-index 1

# Mouse support
set -g mouse on

# Vi mode for copy
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch panes with Alt+arrow (no prefix needed!)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Don't rename windows automatically
set -g allow-rename off

# Increase scrollback buffer
set -g history-limit 50000

# Faster command sequences
set -s escape-time 0

# Aggressive resize
setw -g aggressive-resize on

# Status bar - Catppuccin Mocha theme
set -g status-style bg=#1e1e2e,fg=#cdd6f4
set -g status-left '#[bg=#89b4fa,fg=#1e1e2e,bold] #S '
set -g status-right '#[bg=#313244,fg=#cdd6f4] %H:%M #[bg=#89b4fa,fg=#1e1e2e,bold] #H '
set -g status-left-length 20
set -g status-right-length 50
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[bg=#313244,fg=#cdd6f4,bold] #I:#W '

# Pane borders
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#89b4fa
